name: iOS Shorebird

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "release = 出完整包，patch = 发补丁"
        required: true
        default: release
        type: choice
        options:
          - release
          - patch
      release_version:
        description: "patch 时的版本（如 1.0.24+57），release 留空"
        required: false
        default: ""
      track:
        description: "patch 的 track"
        required: false
        default: stable
      platforms:
        description: "patch 的平台；android,ios 一起发才能保证两边版本号一致"
        required: false
        default: "android,ios"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Read app version
        id: appver
        run: echo "version=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)" >> "$GITHUB_OUTPUT"

      - name: 清掉本机 Gradle Java 路径（仅 CI）
        if: ${{ github.event.inputs.mode == 'patch' }}
        run: sed -i.bak '/org.gradle.java.home/d' android/gradle.properties || true

      - name: Shorebird release iOS (unsigned)
        if: ${{ github.event.inputs.mode == 'release' }}
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          set -o pipefail
          shorebird release ios --no-codesign --flutter-version=3.41.2 2>&1 | tee build_ios.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-shorebird-build-log
          path: build_ios.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Package unsigned IPA
        if: ${{ github.event.inputs.mode == 'release' }}
        run: |
          set -euo pipefail
          APP_DIR="$(find build/ios -type d -name Runner.app -path '*Products/Applications*' | head -n 1)"
          if [ -z "$APP_DIR" ]; then
            APP_DIR="$(find build/ios -type d -name Runner.app | head -n 1)"
          fi
          if [ -z "$APP_DIR" ]; then
            echo "找不到 Runner.app，build/ios 下的目录："
            find build/ios -maxdepth 4 -type d | head -n 60
            exit 1
          fi
          echo "Runner.app = $APP_DIR"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_DIR" Payload/
          IPA="cash-carry-v${{ steps.appver.outputs.version }}-ios-shorebird-unsigned.ipa"
          rm -f "$IPA"
          zip -r -y "$IPA" Payload/
          ls -la "$IPA"

      - name: Upload IPA
        if: ${{ github.event.inputs.mode == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: cash-carry-v${{ steps.appver.outputs.version }}-ios-shorebird-unsigned
          path: cash-carry-v${{ steps.appver.outputs.version }}-ios-shorebird-unsigned.ipa
          retention-days: 7

      - name: Shorebird patch iOS (unsigned)
        if: ${{ github.event.inputs.mode == 'patch' }}
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          shorebird patch --platforms="${{ github.event.inputs.platforms }}" --no-codesign \
            --release-version "${{ github.event.inputs.release_version }}" \
            --track "${{ github.event.inputs.track }}"
